apiVersion: apps/v1
kind: Deployment
metadata:
  name: minipki-frontend
  namespace: minipki
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minipki-frontend
  template:
    metadata:
      labels:
        app: minipki-frontend
    spec:
      containers:
        - name: frontend
          image: minipki-frontend:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: minipki
spec:
  type: LoadBalancer
  selector:
    app: minipki-frontend
  ports:
    - port: 80
      targetPort: 80
